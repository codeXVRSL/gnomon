<title>Gnomon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: handheld console — sun clock, split-world screen, hint line, thumb buttons in one column */
:root{
  --ink:#191529;      /* surround, deep dusk */
  --ink-2:#241e3a;    /* panels */
  --ink-3:#352d55;    /* buttons */
  --brass:#f0b84e;    /* sundial brass accent */
  --parch:#efe3c8;    /* text */
  --mute:#9d92bb;     /* secondary text */
  --violet:#9d7cff;   /* shade magic */
  --display:'Silkscreen','Courier New',monospace;
  --body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bar{width:100%;display:flex;flex-direction:column;gap:6px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box;max-width:620px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;color:var(--brass);font-size:18px;letter-spacing:.06em;line-height:1}
.lvl{font-family:var(--display);font-size:12px;color:var(--mute);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl b{color:var(--parch);font-weight:400}
.icon-btn{font-family:var(--display);background:var(--ink-3);color:var(--parch);border:0;border-radius:4px;padding:8px 10px;font-size:11px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.clock{width:100%;display:flex;align-items:center;gap:10px}
#dial{flex:1;min-width:0;height:28px;image-rendering:pixelated}
.clock-txt{font-family:var(--display);font-size:11px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.clock-txt b{color:var(--brass);font-weight:400}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--display);font-size:12px;background:rgba(25,21,41,.9);color:var(--brass);padding:6px 10px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-size:11px;color:var(--mute)}
.pinbar{display:flex;align-items:center;gap:6px}
.metaR{display:flex;align-items:center;gap:10px}
.mini{font-family:var(--display);font-size:10px;background:var(--ink-3);color:var(--parch);border:0;border-radius:3px;padding:4px 7px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.pinbar i{display:block;width:90px;height:8px;background:var(--ink-3);border-radius:2px;overflow:hidden;position:relative}
.pinbar i b{position:absolute;inset:0;background:var(--violet);transform-origin:left;transform:scaleX(1)}
.hint{width:100%;font-size:14px;line-height:1.4;color:var(--mute);min-height:2.8em;text-wrap:pretty}
.controls{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-bottom:4px}
.ctl{background:var(--ink-3);color:var(--parch);border:0;border-radius:8px;font-family:var(--display);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:0}
.ctl small{font-size:8px;letter-spacing:.06em;color:var(--mute)}
.ctl.on{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);background:#463c72}
.move{display:flex;gap:8px}
.move .ctl{width:60px;height:68px;font-size:22px}
.right{display:grid;grid-template-columns:56px 56px 84px;grid-template-rows:32px 32px;gap:6px;align-items:end}
.ctl.flip{grid-area:1/1;height:32px;font-size:10px;background:#2d3a4a}
.icon-btn.on{background:#4a3a2d;color:var(--brass)}
.ctl.wait{grid-area:2/1;height:32px;font-size:14px;background:#2d2747}
.ctl.pin{grid-area:1/2/3/3;height:70px;font-size:10px;background:#3d2f66}
.ctl.pin small{color:#c7b4ff}
.ctl.pin.on{background:var(--violet);color:#1a1230}
.ctl.pin.on small{color:#1a1230}
.ctl.jump{grid-area:1/3/3/4;height:70px;font-size:14px;background:var(--brass);color:var(--ink)}
.ctl.jump small{color:#5a3f12}
.ctl.jump.on{background:#d79c34}
.keys{font-size:11px;color:var(--mute);font-family:var(--display);text-align:center;width:100%}
@media (hover:none){.keys{display:none}}
@media (max-width:380px){.move .ctl{width:52px}.right{grid-template-columns:50px 50px 72px}}
.overlay{position:fixed;inset:0;background:rgba(15,12,26,.86);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--ink-2);border-radius:6px;padding:20px;max-width:390px;width:100%;box-shadow:0 0 0 2px var(--ink-3),0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto;box-sizing:border-box}
.card h2{font-family:var(--display);font-weight:700;color:var(--brass);margin:0;font-size:20px;letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;line-height:1.45}
.card .sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;font-family:var(--display);font-size:12px;padding:12px;border:0;border-radius:4px;background:var(--ink-3);color:var(--parch);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--brass);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv-btn{aspect-ratio:1;max-width:100%;font-family:var(--display);border:0;border-radius:4px;background:var(--ink-3);color:var(--parch);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px}
.lv-btn small{font-size:8px;color:var(--brass);letter-spacing:.06em}
.lv-btn[disabled]{opacity:.35;cursor:default}
.lv-btn.cur{box-shadow:0 0 0 2px var(--brass)}
.lv-btn.demo{background:#5a2e4a;color:var(--brass)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;line-height:1.4;font-size:14px}
.rules li span:first-child{font-family:var(--display);color:var(--brass)}
.stat{display:flex;gap:16px;font-family:var(--display);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stat b{color:var(--parch);font-weight:400;font-size:16px;display:block}
.logo{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.12em;color:var(--brass);line-height:1;position:relative;text-shadow:0 3px 0 #5a3f12,0 6px 0 rgba(0,0,0,.4)}
.logo i{display:block;height:3px;margin-top:8px;background:linear-gradient(90deg,var(--brass),var(--violet))}
.share{font-family:var(--display);font-size:12px;line-height:1.5;background:var(--ink);padding:10px;border-radius:4px;white-space:pre-wrap;margin:0;user-select:text;-webkit-user-select:text}
.btn.daily{background:#5a4a1a;color:#ffd25e}
.medal{font-family:var(--display);font-size:14px;letter-spacing:.08em;padding:6px 10px;border-radius:4px;display:inline-block;align-self:flex-start}
.medal.m3{background:#5a4a1a;color:#ffd25e}.medal.m2{background:#2d2747;color:#c7b4ff}.medal.m1{background:#3a3346;color:var(--parch)}

/* ---- landscape: thumb clusters in the corners, canvas centred, chrome compressed ---- */
@media (orientation: landscape) {
  #app{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(150px,200px);grid-template-rows:auto auto 1fr auto;grid-template-areas:"hdr hdr hdr" "bar bar bar" "left stage right" "hint hint hint";gap:4px 10px;max-width:none;padding-block:6px;align-items:stretch;justify-items:stretch}
  header{grid-area:hdr}
  #bar{grid-area:bar;flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
  .clock{flex:1;min-width:0;gap:10px}
  .meta{width:auto;gap:12px}
  .pinbar i{width:70px}
  .clock-txt{font-size:10px;line-height:1.2}
  #dial{height:22px;max-width:360px}
  .brand{font-size:15px}
  .lvl{font-size:11px}
  #stage{grid-area:stage;min-height:0}
  .hint{grid-area:hint;min-height:0;font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .hint.open{display:block;-webkit-line-clamp:unset}
  .controls{display:contents}
  .move{grid-area:left;align-self:end;justify-self:start;padding-bottom:env(safe-area-inset-bottom,0px)}
  .right{grid-area:right;align-self:end;justify-self:end;padding-bottom:env(safe-area-inset-bottom,0px)}
  .keys{display:none}
  #helpBtn{display:inline-block!important}
}
/* short landscape (phones): thin bars, hint behind the ? button */
@media (orientation: landscape) and (max-height: 460px) {
  #app{grid-template-rows:auto auto 1fr;grid-template-areas:"hdr hdr hdr" "bar bar bar" "left stage right";gap:2px 8px;padding-block:3px}
  .hint{display:none}
  .hint.open{display:block;position:fixed;left:16px;right:16px;bottom:8px;background:var(--ink-2);padding:10px 12px;border-radius:6px;z-index:5;box-shadow:0 0 0 2px var(--ink-3);font-size:13px}
  #dial{height:14px}
  .clock-txt{white-space:nowrap;font-size:9px}
  .clock-txt br{display:none}
  .clock-txt b::after{content:" · "}
  #shards{display:none}
  .mini{padding:3px 6px;font-size:9px}
  .icon-btn{padding:5px 8px;font-size:10px}
  .brand{font-size:13px}
  .move .ctl{width:58px;height:58px}
  .ctl.jump{height:66px;width:80px}
  .ctl.pin{height:66px}
  .ctl.flip,.ctl.wait{height:30px}
  .right{grid-template-rows:30px 30px}
}
@media (orientation: landscape) and (min-height: 600px) {
  #app{max-width:1500px;margin:0 auto;grid-template-columns:minmax(120px,150px) 1fr minmax(150px,180px)}
  .hint{font-size:13px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header>
    <div class="brand">GNOMON</div>
    <div class="lvl" id="lvl"></div>
    <button class="icon-btn" id="helpBtn" aria-label="Show stage hint" style="display:none">?</button>
    <button class="icon-btn" id="rotBtn" aria-label="Go fullscreen landscape">⟳</button>
    <button class="icon-btn" id="viewBtn" aria-label="Toggle 2.5D camera" hidden>2.5D</button>
    <button class="icon-btn" id="menuBtn">LEVELS</button>
  </header>
  <div id="bar">
  <div class="clock">
    <canvas id="dial" width="200" height="14" aria-label="Sun clock"></canvas>
    <div class="clock-txt"><b id="phase">Dawn</b><br>DAY <span id="day">1</span></div>
  </div>
  <div class="meta">
    <div class="pinbar">PIN <i><b id="pinfill"></b></i></div>
    <div class="metaR"><span id="falls">☠ 0</span><span id="shards">✦ 0/0</span><button class="mini" id="resetBtn" aria-label="Restart stage">↻ RESTART</button></div>
  </div>
  </div>
  <div id="stage"><canvas id="game" width="240" height="168" aria-label="Game screen"></canvas><div id="toast"></div></div>
  <div class="hint" id="hint"></div>
  <div class="controls">
    <div class="move">
      <button class="ctl" data-k="l" aria-label="Left">◀</button>
      <button class="ctl" data-k="r" aria-label="Right">▶</button>
    </div>
    <div class="right">
      <button class="ctl flip" data-k="f" aria-label="Flip gravity">FLIP</button>
      <button class="ctl wait" data-k="w" aria-label="Hold to let time pass">⧗</button>
      <button class="ctl pin" data-k="p" aria-label="Hold to pin your shadow">PIN<small>HOLD</small></button>
      <button class="ctl jump" data-k="j" aria-label="Jump">JUMP<small>▲▼</small></button>
    </div>
  </div>
  <div class="keys">←→ move · ↑/Space jump · F flip · hold E pin · hold ↓ pass time · V camera · R restart</div>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>

<script>
/*__ENGINE__*/
/*__LEVELS__*/
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), g = cv.getContext('2d');
const dial = $('dial'), dg = dial.getContext('2d');
let W = 240; const H = 168;

const P = { o:'#241a2c', y:'#f6c85f', Y:'#c98b2b', b:'#efe3c8', B:'#cdbb98', k:'#241a2c', r:'#e9806e' };
const SPR = [
"................",
".......o........",
"......oyo.......",
".....oyyYo......",
"....oyyyYYo.....",
"...oyyyyYYYo....",
"..oooooooooooo..",
"...obbbbbbbbo...",
"...obkbbbbkbo...",
"...obbbbbbbbo...",
"...orbbbbbbro...",
"...obbbbbbbbo...",
"....oBBBBBBo....",
".....oYooYo.....",
".....oYo.oYo....",
"................"];
const SPR_WALK = SPR.map((r, i) => i === 13 ? "....oYo..oYo...." : i === 14 ? "...oYo....oYo..." : r);
const SPR_JUMP = SPR.map((r, i) => i === 12 ? "...ooBBBBBBoo..." : i === 13 ? "..oYoYoooYoYo..." : i === 14 ? "................" : r);
function sprite(map, pal, flipX, flipY) {
  const c = document.createElement('canvas'); c.width = c.height = 16; const x = c.getContext('2d');
  map.forEach((row, yy) => [...row].forEach((ch, xx) => { if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(flipX ? 15 - xx : xx, flipY ? 15 - yy : yy, 1, 1); } }));
  return c;
}
const walk2 = SPR_WALK;
const sleepMap = SPR.map((r, i) => i === 8 ? r.replace(/k/g, 'b') : i === 9 ? "...obooboobobo..".replace(/./g, (c, j) => j >= 3 && j <= 12 ? (j === 5 || j === 10 ? 'o' : 'b') : c) : r);
const shPal = { o:'#8a6fe6', y:'#0c0719', Y:'#0c0719', b:'#0c0719', B:'#0c0719', k:'#e4d8ff', r:'#0c0719' };
const pinPal = { o:'#c7b4ff', y:'#2a1c4a', Y:'#2a1c4a', b:'#2a1c4a', B:'#2a1c4a', k:'#ffffff', r:'#2a1c4a' };
const S = {};
for (const [k, map, pal] of [['p', SPR, P], ['p2', walk2, P], ['pj', SPR_JUMP, P], ['sl', sleepMap, P], ['s', SPR, shPal], ['s2', walk2, shPal], ['sj', SPR_JUMP, shPal], ['pin', SPR, pinPal]])
  for (const fx of [0, 1]) for (const fy of [0, 1]) S[k + fx + fy] = sprite(map, pal, !!fx, !!fy);

let li = 0, L, st, acc = 0, last = 0, toastT, parts = [], flash = 0, shake = 0, shakeX = 0, shakeY = 0;
let squashP = 1, squashS = 1, dawnTimer = 0, camX = 0, hitStop = 0;
let save = { best: {}, at: 0, shards: {}, demoFirst: false, seen: false, view25: false };
try { save = Object.assign({ best: {}, at: 0, shards: {}, demoFirst: false, seen: false, view25: false }, JSON.parse(localStorage.getItem('gnomon-v5')) || {}); } catch (e) {}
const DEMO = LEVELS.findIndex(l => l.demo);
// ---- Daily Sundial: one stage per calendar day, same for everyone ----
const DAILY_EPOCH = Date.UTC(2026, 10, 1);
function dailyInfo() {
  const now = new Date(); const day = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - DAILY_EPOCH) / 86400000);
  const pool = LEVELS.map((_, i) => i).filter(i => !LEVELS[i].demo);
  let h = Math.imul(Math.max(0, day) + 1, 2654435761) >>> 0; h = (h ^ (h >>> 15)) >>> 0;
  return { n: day + 1, li: pool[h % pool.length], key: 'd' + (day + 1) };
}
let dailyMode = false;
const SHARE_URL = location.origin && location.origin.startsWith('http') && !location.origin.includes('claude') ? location.origin + location.pathname : 'https://codexvrsl.github.io/gnomon/';
const order = () => { const rest = LEVELS.map((_, i) => i).filter(i => i !== DEMO); return save.demoFirst ? [DEMO, ...rest] : [...rest, DEMO]; };
const persist = () => { try { localStorage.setItem('gnomon-v5', JSON.stringify(save)); } catch (e) {} };
const keys = { l: 0, r: 0, j: 0, w: 0, p: 0, f: 0 }; let jumpEdge = false, flipEdge = false;
function toggleView() { save.view25 = !save.view25; persist(); $('viewBtn').classList.toggle('on', save.view25); toast(save.view25 ? 'CAMERA · 2.5D' : 'CAMERA · FLAT'); beep(520, .08, 'sine', .04, 1.4); }

// ---------- audio ----------
let ac = null, muted = false;
function beep(f, d = .07, type = 'square', v = .045, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, ac.currentTime + d);
    gn.gain.setValueAtTime(v, ac.currentTime); gn.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(gn).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1700); }

function load(i) {
  li = i; L = parse(LEVELS[i]); st = init(L); parts = []; shake = 0; flash = 0; camX = Math.max(0, Math.min(L.PX - W, st.p.x - W / 2));
  save.at = i; persist();
  $('lvl').innerHTML = LEVELS[i].demo ? `<b>DEMO</b> · ${LEVELS[i].name}` : `<b>${String(order().filter(k => k !== DEMO).indexOf(i) + 1).padStart(2, '0')}</b> · ${LEVELS[i].name}`;
  $('hint').textContent = LEVELS[i].hint;
  toast((LEVELS[i].demo ? 'DEMO · ' : '') + LEVELS[i].name.toUpperCase());
  // only show the powers this stage actually needs, so the sun stays the star
  const uses = LEVELS[i].uses || { flip: true, pin: true };
  document.querySelector('.ctl.flip').style.visibility = uses.flip ? '' : 'hidden';
  document.querySelector('.ctl.pin').style.visibility = uses.pin ? '' : 'hidden';
  document.querySelector('.pinbar').style.visibility = uses.pin ? '' : 'hidden';
  resize();
}
function burst(x, y, col, n = 14, sp = 1.6) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = .4 + Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 26 + Math.random() * 18, col }); } }
function dust(x, y, dirY) { for (let i = 0; i < 5; i++) parts.push({ x: x + Math.random() * 8, y, vx: (Math.random() - .5) * 1.4, vy: -dirY * (.2 + Math.random() * .5), life: 14 + Math.random() * 8, col: 'rgba(240,230,210,.7)' }); }

const DEATH = { fell: 'You fell into the dark', spikes: 'Spikes', crushed: 'Crushed', 'shadow fell': 'Your shadow fell into the light', 'shadow spikes': 'Your shadow hit spikes', 'shadow crushed': 'Your shadow was crushed', lamplight: 'Lamplight burned your shadow', lantern: 'A lantern-bearer caught you', 'lantern light': 'Lantern light burned your shadow', 'shadow hound': 'A shade hound caught your shadow' };
function handleEvents(prevP, prevS, prevG) {
  for (const ev of st.events) {
    if (ev === 'jump') { beep(520, .06, 'square', .03, 1.6); squashP = .72; squashS = .72; }
    if (ev === 'land') { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} squashP = 1.35; shake = Math.max(shake, 1.5); dust(st.p.x, st.p.y + (st.grav > 0 ? PH : 0), st.grav); beep(160, .04, 'triangle', .03); }
    if (ev === 'swim') { beep(420, .05, 'sine', .03, 1.3); for (let i = 0; i < 3; i++) parts.push({ x: st.p.x + Math.random() * 8, y: st.p.y + 4, vx: (Math.random() - .5) * .4, vy: -.4 - Math.random() * .4, life: 20, col: 'rgba(220,240,255,.8)' }); }
    if (ev === 'spring') { beep(300, .18, 'square', .05, 2.5); squashP = .6; squashS = .6; shake = 2; }
    if (ev === 'flip') { toast(st.grav < 0 ? 'GRAVITY TURNED · you fall skyward' : 'GRAVITY RESTORED'); beep(220, .25, 'sawtooth', .05, st.grav < 0 ? 2.2 : .45); shake = 4; burst(st.p.x + 4, st.p.y + 6, '#9fd0e8', 10, 1); }

  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); toast('LANDSCAPE LOCKED'); }
  catch (e) { toast(window.innerWidth > window.innerHeight ? 'ALREADY LANDSCAPE' : 'TURN YOUR PHONE SIDEWAYS (unlock rotation)'); }
  setTimeout(resize, 300);
};

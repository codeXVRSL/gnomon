<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#191529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Gnomon — a two-world pixel platformer on a sundial clock.">
<title>Gnomon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>html{color-scheme:dark;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;height:100%;font:14px system-ui,sans-serif;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: handheld console — sun clock, split-world screen, hint line, thumb buttons in one column */
:root{
  --ink:#191529;      /* surround, deep dusk */
  --ink-2:#241e3a;    /* panels */
  --ink-3:#352d55;    /* buttons */
  --brass:#f0b84e;    /* sundial brass accent */
  --parch:#efe3c8;    /* text */
  --mute:#9d92bb;     /* secondary text */
  --violet:#9d7cff;   /* shade magic */
  --display:'Silkscreen','Courier New',monospace;
  --body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bar{width:100%;display:flex;flex-direction:column;gap:6px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;box-sizing:border-box;max-width:620px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;color:var(--brass);font-size:18px;letter-spacing:.06em;line-height:1}
.lvl{font-family:var(--display);font-size:12px;color:var(--mute);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl b{color:var(--parch);font-weight:400}
.icon-btn{font-family:var(--display);background:var(--ink-3);color:var(--parch);border:0;border-radius:4px;padding:8px 10px;font-size:11px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.clock{width:100%;display:flex;align-items:center;gap:10px}
#dial{flex:1;min-width:0;height:28px;image-rendering:pixelated}
.clock-txt{font-family:var(--display);font-size:11px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.clock-txt b{color:var(--brass);font-weight:400}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--display);font-size:12px;background:rgba(25,21,41,.9);color:var(--brass);padding:6px 10px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-size:11px;color:var(--mute)}
.pinbar{display:flex;align-items:center;gap:6px}
.metaR{display:flex;align-items:center;gap:10px}
.mini{font-family:var(--display);font-size:10px;background:var(--ink-3);color:var(--parch);border:0;border-radius:3px;padding:4px 7px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.pinbar i{display:block;width:90px;height:8px;background:var(--ink-3);border-radius:2px;overflow:hidden;position:relative}
.pinbar i b{position:absolute;inset:0;background:var(--violet);transform-origin:left;transform:scaleX(1)}
.hint{width:100%;font-size:14px;line-height:1.4;color:var(--mute);min-height:2.8em;text-wrap:pretty}
.controls{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-bottom:4px}
.ctl{background:var(--ink-3);color:var(--parch);border:0;border-radius:8px;font-family:var(--display);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:0}
.ctl small{font-size:8px;letter-spacing:.06em;color:var(--mute)}
.ctl.on{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);background:#463c72}
.move{display:flex;gap:8px}
.move .ctl{width:60px;height:68px;font-size:22px}
.right{display:grid;grid-template-columns:56px 56px 84px;grid-template-rows:32px 32px;gap:6px;align-items:end}
.ctl.flip{grid-area:1/1;height:32px;font-size:10px;background:#2d3a4a}
.icon-btn.on{background:#4a3a2d;color:var(--brass)}
.ctl.wait{grid-area:2/1;height:32px;font-size:14px;background:#2d2747}
.ctl.pin{grid-area:1/2/3/3;height:70px;font-size:10px;background:#3d2f66}
.ctl.pin small{color:#c7b4ff}
.ctl.pin.on{background:var(--violet);color:#1a1230}
.ctl.pin.on small{color:#1a1230}
.ctl.jump{grid-area:1/3/3/4;height:70px;font-size:14px;background:var(--brass);color:var(--ink)}
.ctl.jump small{color:#5a3f12}
.ctl.jump.on{background:#d79c34}
.keys{font-size:11px;color:var(--mute);font-family:var(--display);text-align:center;width:100%}
@media (hover:none){.keys{display:none}}
@media (max-width:380px){.move .ctl{width:52px}.right{grid-template-columns:50px 50px 72px}}
.overlay{position:fixed;inset:0;background:rgba(15,12,26,.86);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--ink-2);border-radius:6px;padding:20px;max-width:390px;width:100%;box-shadow:0 0 0 2px var(--ink-3),0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto;box-sizing:border-box}
.card h2{font-family:var(--display);font-weight:700;color:var(--brass);margin:0;font-size:20px;letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;line-height:1.45}
.card .sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;font-family:var(--display);font-size:12px;padding:12px;border:0;border-radius:4px;background:var(--ink-3);color:var(--parch);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--brass);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv-btn{aspect-ratio:1;max-width:100%;font-family:var(--display);border:0;border-radius:4px;background:var(--ink-3);color:var(--parch);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px}
.lv-btn small{font-size:8px;color:var(--brass);letter-spacing:.06em}
.lv-btn[disabled]{opacity:.35;cursor:default}
.lv-btn.cur{box-shadow:0 0 0 2px var(--brass)}
.lv-btn.demo{background:#5a2e4a;color:var(--brass)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;line-height:1.4;font-size:14px}
.rules li span:first-child{font-family:var(--display);color:var(--brass)}
.stat{display:flex;gap:16px;font-family:var(--display);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stat b{color:var(--parch);font-weight:400;font-size:16px;display:block}
.logo{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.12em;color:var(--brass);line-height:1;position:relative;text-shadow:0 3px 0 #5a3f12,0 6px 0 rgba(0,0,0,.4)}
.logo i{display:block;height:3px;margin-top:8px;background:linear-gradient(90deg,var(--brass),var(--violet))}
.share{font-family:var(--display);font-size:12px;line-height:1.5;background:var(--ink);padding:10px;border-radius:4px;white-space:pre-wrap;margin:0;user-select:text;-webkit-user-select:text}
.btn.daily{background:#5a4a1a;color:#ffd25e}
.medal{font-family:var(--display);font-size:14px;letter-spacing:.08em;padding:6px 10px;border-radius:4px;display:inline-block;align-self:flex-start}
.medal.m3{background:#5a4a1a;color:#ffd25e}.medal.m2{background:#2d2747;color:#c7b4ff}.medal.m1{background:#3a3346;color:var(--parch)}

/* ---- landscape: thumb clusters in the corners, canvas centred, chrome compressed ---- */
@media (orientation: landscape) {
  #app{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(150px,200px);grid-template-rows:auto auto 1fr auto;grid-template-areas:"hdr hdr hdr" "bar bar bar" "left stage right" "hint hint hint";gap:4px 10px;max-width:none;padding-block:6px;align-items:stretch;justify-items:stretch}
  header{grid-area:hdr}
  #bar{grid-area:bar;flex-direction:row;align-items:center;justify-content:space-between;gap:14px}
  .clock{flex:1;min-width:0;gap:10px}
  .meta{width:auto;gap:12px}
  .pinbar i{width:70px}
  .clock-txt{font-size:10px;line-height:1.2}
  #dial{height:22px;max-width:360px}
  .brand{font-size:15px}
  .lvl{font-size:11px}
  #stage{grid-area:stage;min-height:0}
  .hint{grid-area:hint;min-height:0;font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .hint.open{display:block;-webkit-line-clamp:unset}
  .controls{display:contents}
  .move{grid-area:left;align-self:end;justify-self:start;padding-bottom:env(safe-area-inset-bottom,0px)}
  .right{grid-area:right;align-self:end;justify-self:end;padding-bottom:env(safe-area-inset-bottom,0px)}
  .keys{display:none}
  #helpBtn{display:inline-block!important}
}
/* short landscape (phones): thin bars, hint behind the ? button */
@media (orientation: landscape) and (max-height: 460px) {
  #app{grid-template-rows:auto auto 1fr;grid-template-areas:"hdr hdr hdr" "bar bar bar" "left stage right";gap:2px 8px;padding-block:3px}
  .hint{display:none}
  .hint.open{display:block;position:fixed;left:16px;right:16px;bottom:8px;background:var(--ink-2);padding:10px 12px;border-radius:6px;z-index:5;box-shadow:0 0 0 2px var(--ink-3);font-size:13px}
  #dial{height:14px}
  .clock-txt{white-space:nowrap;font-size:9px}
  .clock-txt br{display:none}
  .clock-txt b::after{content:" · "}
  #shards{display:none}
  .mini{padding:3px 6px;font-size:9px}
  .icon-btn{padding:5px 8px;font-size:10px}
  .brand{font-size:13px}
  .move .ctl{width:58px;height:58px}
  .ctl.jump{height:66px;width:80px}
  .ctl.pin{height:66px}
  .ctl.flip,.ctl.wait{height:30px}
  .right{grid-template-rows:30px 30px}
}
@media (orientation: landscape) and (min-height: 600px) {
  #app{max-width:1500px;margin:0 auto;grid-template-columns:minmax(120px,150px) 1fr minmax(150px,180px)}
  .hint{font-size:13px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <header>
    <div class="brand">GNOMON</div>
    <div class="lvl" id="lvl"></div>
    <button class="icon-btn" id="helpBtn" aria-label="Show stage hint" style="display:none">?</button>
    <button class="icon-btn" id="rotBtn" aria-label="Go fullscreen landscape">⟳</button>
    <button class="icon-btn" id="viewBtn" aria-label="Toggle 2.5D camera" hidden>2.5D</button>
    <button class="icon-btn" id="menuBtn">LEVELS</button>
  </header>
  <div id="bar">
  <div class="clock">
    <canvas id="dial" width="200" height="14" aria-label="Sun clock"></canvas>
    <div class="clock-txt"><b id="phase">Dawn</b><br>DAY <span id="day">1</span></div>
  </div>
  <div class="meta">
    <div class="pinbar">PIN <i><b id="pinfill"></b></i></div>
    <div class="metaR"><span id="falls">☠ 0</span><span id="shards">✦ 0/0</span><button class="mini" id="resetBtn" aria-label="Restart stage">↻ RESTART</button></div>
  </div>
  </div>
  <div id="stage"><canvas id="game" width="240" height="168" aria-label="Game screen"></canvas><div id="toast"></div></div>
  <div class="hint" id="hint"></div>
  <div class="controls">
    <div class="move">
      <button class="ctl" data-k="l" aria-label="Left">◀</button>
      <button class="ctl" data-k="r" aria-label="Right">▶</button>
    </div>
    <div class="right">
      <button class="ctl flip" data-k="f" aria-label="Flip gravity">FLIP</button>
      <button class="ctl wait" data-k="w" aria-label="Hold to let time pass">⧗</button>
      <button class="ctl pin" data-k="p" aria-label="Hold to pin your shadow">PIN<small>HOLD</small></button>
      <button class="ctl jump" data-k="j" aria-label="Jump">JUMP<small>▲▼</small></button>
    </div>
  </div>
  <div class="keys">←→ move · ↑/Space jump · F flip · hold E pin · hold ↓ pass time · V camera · R restart</div>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>

<script>
// Two worlds, one clock — v3: gravity flip, pin, traps
const TS = 12, ROWS = 14, HALF = 7, HZ = HALF * TS;
const PHYS = { g: 0.3, gFall: 0.42, gHang: 0.14, hangV: 0.9, jump: 4.6, run: 1.3, accel: 0.32, decel: 0.38, airAccel: 0.22, airDecel: 0.08, maxFall: 5.5, coyote: 6, buffer: 6, spring: 7.2, corner: 3 };
const HOUR_PX = 60, WAIT_RATE = 1 / 40, NOON = 3.5, NOON_GAP = 0.25, DUSK = 7, DAY_TOTAL = 10, FLIP_COST = 0.5;
const WATER = { g: 0.08, maxFall: 1.0, run: 0.8, stroke: 1.6, strokeCd: 8, exit: 3.3 };
const PW = 8, PH = 11, SW = 8, SH = 11, NIGHT_H = 11;
const CAST_K = 18; // px the sun slides a shadow per hour (±63 px over the day)
const ENEMY_SPEED = 60, EW = 8, EH = 8, LANTERN_R = 10; // enemies move per hour of game time // px of slab drift per hour
const PIN_MAX = 140, PIN_DRAIN = 1, PIN_REFILL = 0.4;
const CRUMBLE_SHAKE = 22, CRUMBLE_GONE = 130;
const CHIME_WARN = 0.6, CHIME_ON = 0.75; // fraction of the hour

function parse(def) {
  const rows = def.map, W = Math.max(...rows.map(r => r.length));
  const grid = rows.map(r => r.padEnd(W, '.').split(''));
  let start = null; const lamps = [], shards = [], stones = [], enemies = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c === 'S') { start = [x, y]; grid[y][x] = '.'; }
    if (c === '*') lamps.push([x * TS + TS / 2, y * TS + TS / 2]);
    if (c === 'o') { shards.push([x, y]); grid[y][x] = '.'; }
    if (c === '=' && y < HALF) stones.push([x, y]);
    if ((c === 'h' || c === 'H') && y >= HALF) { enemies.push({ kind: 'hound', world: 'bot', x: x * TS + 2, y: y * TS, dir: c === 'H' ? 1 : -1 }); grid[y][x] = '.'; }
    if ((c === 'l' || c === 'L') && y < HALF) { enemies.push({ kind: 'lantern', world: 'top', x: x * TS + 2, y: y * TS + TS - EH, dir: c === 'L' ? 1 : -1 }); grid[y][x] = '.'; }
  }
  return { def, grid, W, PX: W * TS, start, lamps, shards, stones, enemies, lampR: def.lampR ?? 20, hourPx: def.hourPx ?? HOUR_PX };
}

function shadowHeight(t) { return SH; } // the shadow keeps its size; the sun moves it sideways instead
const isGone = t => t < DUSK && Math.abs(t - NOON) < NOON_GAP;
const frac = t => t - Math.floor(t);
const chimeState = t => { const f = frac(t); return f >= CHIME_ON ? 2 : f >= CHIME_WARN ? 1 : 0; };
const morningSolid = t => t < NOON;           // 'm'
const eveningSolid = t => t >= NOON;          // 'e' (incl. night)

const castDx = t => (NOON - t) * CAST_K;
function slabs(L, st, t = st.t) {
  if (t >= DUSK || isGone(t) || !L.stones.length) return [];
  const dx = castDx(t);
  return L.stones.map(([tx, ty]) => ({ x: tx * TS + dx, y: (ROWS - 1 - ty) * TS, w: TS, h: TS }));
}
function rectHit(r, x, y, w, h) { return x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y; }
function tileAt(L, tx, ty) { if (tx < 0 || tx >= L.W) return '#'; if (ty < 0 || ty >= ROWS) return '#'; return L.grid[ty][tx]; }

function forTiles(x, y, w, h, fn) {
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.01) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.01) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (fn(tx, ty) === true) return true;
  return false;
}
function pressedSet(L, st) {
  const set = new Set(); const s = st.s, p = st.p;
  forTiles(p.x, p.y, PW, PH, (tx, ty) => { const c = tileAt(L, tx, ty); if (c >= 'a' && c <= 'd' && ty < HALF) set.add(c.toUpperCase()); });
  if (!s.gone) forTiles(s.x, s.y, SW, s.h, (tx, ty) => { const c = tileAt(L, tx, ty); if (c >= 'a' && c <= 'd' && ty >= HALF) set.add(c.toUpperCase()); });
  return set;
}
function overlapsShadowTile(st, tx, ty) {
  const s = st.s; if (s.gone) return false; return s.x < (tx + 1) * TS && s.x + SW > tx * TS && s.y < (ty + 1) * TS && s.y + s.h > ty * TS;
}
function inWater(L, world, b, w, h) {
  const cx = b.x + w / 2, cy = b.y + h / 2; const tx = Math.floor(cx / TS), ty = Math.floor(cy / TS);
  if (world === 'top' ? ty >= HALF : ty < HALF) return false;
  return tileAt(L, tx, ty) === '~';
}
function overlapsPlayerTile(st, tx, ty) {
  const p = st.p; return p.x < (tx + 1) * TS && p.x + PW > tx * TS && p.y < (ty + 1) * TS && p.y + PH > ty * TS;
}
function crumbleGone(st, tx, ty) { const c = st.crumble[tx + ',' + ty]; return c && c.gone > 0; }
function solid(L, st, world, tx, ty, pr) {
  if (world === 'top') { if (ty >= HALF) return false; if (ty < 0) return true; }
  else { if (ty < HALF) return false; }
  const c = tileAt(L, tx, ty);
  if (c === '#' || c === '*' || c === '=') return true;
  if (c === 'c') return !crumbleGone(st, tx, ty);
  if (c === 'm') return morningSolid(st.t) && st.t < DUSK;
  if (c === 'e') return eveningSolid(st.t);
  if (c >= 'A' && c <= 'D') return !(pr.has(c) || (world === 'top' ? overlapsPlayerTile(st, tx, ty) : overlapsShadowTile(st, tx, ty)));
  return false;
}
function overlap(L, st, world, x, y, w, h, pr) {
  if (world === 'bot' && L.stones.length) for (const r of slabs(L, st)) if (rectHit(r, x, y, w, h)) return true;
  return forTiles(x, y, w, h, (tx, ty) => solid(L, st, world, tx, ty, pr));
}
function tryMove(L, st, world, b, w, h, dx, dy, pr) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.5));
  let hitX = false, hitY = false;
  for (let i = 0; i < n; i++) {
    if (dx) { const nx = b.x + dx / n; if (!overlap(L, st, world, nx, b.y, w, h, pr)) b.x = nx; else { hitX = true; dx = 0; } }
    if (dy) { const ny = b.y + dy / n; if (!overlap(L, st, world, b.x, ny, w, h, pr)) b.y = ny; else { hitY = true; dy = 0; } }
  }
  return { hitX, hitY };
}
// if the body is pushed into a solid that just appeared (evening stone, crumble return), nudge it out or kill
function squeezed(L, st, world, b, w, h, pr) { return overlap(L, st, world, b.x, b.y, w, h, pr); }

function spawnShadow(L, st, x) {
  const s = st.s, pr = new Set(); const h = s.h; x = Math.max(0, Math.min(L.PX - SW, Math.round(x)));
  const dirY = st.grav > 0 ? 1 : -1; // normal: shadow ground is HZ (top of its world); flipped: bottom
  for (let r = 0; r <= 24; r++) for (const sg of r ? [-1, 1] : [1]) {
    const nx = x + sg * r;
    const ys = []; for (let y = HZ; y <= ROWS * TS - h; y += 2) ys.push(y);
    if (dirY < 0) ys.reverse();

function how() {
  showCard(`<h2>How to play</h2>
    <p>You are a gnomon, the pin of a sundial, trying to get back to your dial. Your shadow lives in the upside-down world below and copies every step. When you jump up, it jumps down.</p>
    <ul class="rules">
      <li><span>☀</span><span><b>Time only moves when you move.</b> Hold ⧗ to let it pass. Your shadow is long at dawn and dusk, short at midday, and gone at noon.</span></li>
      <li><span>✎</span><span><b>PIN</b> (hold) nails your shadow in place so it stops copying you. The pin wears out and recharges.</span></li>
      <li><span>⇅</span><span><b>FLIP</b> turns the world over, and in an upside-down sky <b>the sun runs backward</b>: walking the ceiling rewinds the day and swings your shadow back east. Flip again to let time flow on. Only while standing.</span></li>
      <li><span>☾</span><span><b>At night</b> you sleep and steer your shadow alone. <b>At dawn</b> you wake where it stands.</span></li>
      <li><span>☠</span><span><b>Lantern-bearers</b> and <b>shade hounds</b> walk only as the hours pass, even while you wait. A lantern burns shade in the world beneath it.</span></li>
      <li><span>◎</span><span><b>2.5D</b> in the top bar tilts the camera to show depth; the sun lights the blocks from its side of the sky.</span></li>
      <li><span>◆</span><span><b>Sunstones</b> cast a slab of shade below that slides west through the day. Your shadow can ride it.</span></li>
      <li><span>≈</span><span><b>Water</b> slows you but not your shadow. Press JUMP to swim; push against an edge to climb out.</span></li>
      <li><span>!</span><span>Shade presses violet plates, your feet press brass ones. Chime spikes rise late in every hour. Cracked stones crumble. Pale stones hold before noon, dark ones after.</span></li>
    </ul>
    <div class="row"><button class="btn primary" id="okBtn">Play</button></div>`);
  $('okBtn').onclick = hideCard;
}

      g.fillStyle = '#f0b84e'; g.fillRect(nx - 1, ny - 5, 2, 10); g.fillRect(nx - 3, ny - 5, 6, 2);
      g.fillStyle = 'rgba(199,180,255,.5)'; for (let k = 0; k < 4; k++) { g.fillRect(spx - 2 + (k % 2) * 13, spy - 2 + Math.floor(k / 2) * (sh + 1), 3, 1); g.fillRect(spx - 2 + (k % 2) * 13, spy - 2 + Math.floor(k / 2) * (sh + 1), 1, 3); }
    }
  } else {
    const k = (now / 120) % 6;
    g.fillStyle = 'rgba(199,180,255,.7)';
    g.fillRect(Math.round(p.x) + 3, HZ + 3 + k, 2, 2); g.fillRect(Math.round(p.x) - 1, HZ + 8 - k / 2, 1, 1); g.fillRect(Math.round(p.x) + 8, HZ + 6 + k / 3, 1, 1);
  }
  drawEnemies(now, night);
  for (const q of parts) { g.globalAlpha = Math.min(1, q.life / 20); g.fillStyle = q.col; g.fillRect(q.x | 0, q.y | 0, 2, 2); }
  g.globalAlpha = 1;
  if (flipped && !night) { g.fillStyle = 'rgba(240,184,78,.07)'; g.fillRect(camX, 0, W, H); g.fillStyle = 'rgba(255,240,200,.35)'; for (let i = 0; i < 6; i++) { const yy = 6 + i * 13, xx = camX + W - ((now / 6 + i * 47) % (W + 30)); g.fillRect(xx, yy, 10, 1); } }
  if (flash > 0) { g.fillStyle = `rgba(255,236,190,${flash * .6})`; g.fillRect(-4, -4, W + 8, H + 8); flash = Math.max(0, flash - .03); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawDial();
  $('pinfill').style.transform = `scaleX(${st.pin / PIN_MAX})`;
  $('pinfill').style.background = st.pin < 30 ? '#e9806e' : 'var(--violet)';
  $('shards').textContent = `✦ ${st.shardsGot}/${L.shards.length}`;
  $('falls').textContent = `☠ ${st.deaths}`;
}

// ---------- 2.5D camera: cabinet extrusion of every solid block ----------
const EX = 4; // depth in px
function isBlock(c) { return c === '#' || c === '=' || c === 'c' || c === 'm' || c === 'e' || c === '*'; }
function blockAlpha(c, x, y, t) {
  if (c === 'c') { const cr = st.crumble[x + ',' + y]; if (cr && cr.gone > 0) return cr.gone < 30 ? .35 : 0; }
  if (c === 'm') return (morningSolid(t) && t < DUSK) ? 1 : .22;
  if (c === 'e') return eveningSolid(t) ? 1 : .22;
  return 1;
}
function face(x1, y1, x2, y2, x3, y3, x4, y4, col) { g.fillStyle = col; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.lineTo(x4, y4); g.closePath(); g.fill(); }
function drawExtrusions(now, t, night, pr) {
  const sunK = night ? .5 : t / DUSK; // 0 = sun in the east (left), 1 = west (right)
  const sideLit = .55 + .45 * sunK;  // right-hand faces brighten as the sun moves west
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < L.W; x++) {
    const c = L.grid[y][x], topW = y < HALF;
    const px = x * TS, py = y * TS, dy = topW ? -EX : EX; // light world rises toward the sky, shadow world sinks
    if (isBlock(c)) {
      const a = blockAlpha(c, x, y, t); if (!a) continue;
      g.globalAlpha = a;
      const base = c === '=' ? [246, 200, 95] : c === 'm' ? [239, 227, 200] : c === 'e' ? [110, 95, 140] : topW ? (night ? [110, 100, 140] : [168, 150, 120]) : [90, 70, 140];
      const topCol = (c === '#' && topW) ? (night ? [107, 148, 136] : [166, 210, 122]) : base.map(v => Math.min(255, v * 1.25) | 0);
      const nb = (ty, tx) => { const cc = tileAt(L, tx, ty); return isBlock(cc) && blockAlpha(cc, tx, ty, t) > .5; };
      // crisp pixel extrusion: a strip above (light world) or below (shadow world), and a slab on the right
      if (!nb(topW ? y - 1 : y + 1, x) && !(topW && y === 0) && !(!topW && y === ROWS - 1)) {
        g.fillStyle = `rgb(${topCol.join(',')})`;
        g.fillRect(px + 2, topW ? py - EX : py + TS, TS - 2 + (nb(y, x + 1) ? 2 : 0), EX);
        g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(px + 2, topW ? py - EX : py + TS + EX - 1, 2, 1);
      }
      if (!nb(y, x + 1)) {
        g.fillStyle = `rgb(${base.map(v => (v * sideLit) | 0).join(',')})`;
        g.fillRect(px + TS, topW ? py - EX + 2 : py + 2, EX, TS - 2);
      }
      g.globalAlpha = 1;
    } else if (c >= 'A' && c <= 'D') {
      const open = pr.has(c) || (topW ? overlapsPlayerTile(st, x, y) : overlapsShadowTile(st, x, y));
      if (!open && !(tileAt(L, x, topW ? y - 1 : y + 1) >= 'A' && tileAt(L, x, topW ? y - 1 : y + 1) <= 'D')) { g.fillStyle = '#b07a4a'; g.fillRect(px + 4, topW ? py - EX : py + TS, 8, EX); }
      if (!open) { g.fillStyle = '#5a3520'; g.fillRect(px + 12, topW ? py - EX + 2 : py + 2, EX, TS - 2); }
    } else if (c === '~') {
      const surface = topW ? (y === 0 || L.grid[y - 1][x] !== '~') : (y === ROWS - 1 || L.grid[y + 1][x] !== '~');
      if (surface) { g.fillStyle = topW ? 'rgba(150,200,240,.8)' : 'rgba(150,120,230,.7)'; g.fillRect(px + 2, topW ? py + 2 - EX : py + TS - 2, TS, EX); }
    }
  }
  // sun slabs get a sliver of depth too
  for (const r of slabs(L, st)) { const rx = Math.round(r.x); g.fillStyle = 'rgba(60,40,100,.85)'; g.fillRect(rx + 2, r.y + r.h, r.w, EX); }
}
// ---------- enemies ----------
function drawEnemies(now, night) {
  for (const e of st.enemies) {
    const x = Math.round(e.x), y = Math.round(e.y), step = Math.floor(now / 160 + e.x) % 2;
    if (e.kind === 'lantern') {
      // warm glow around the bearer, and its light falling into the shadow world
      g.fillStyle = 'rgba(255,214,120,.18)'; g.beginPath(); g.arc(x + 4, y + 3, 11, 0, 6.29); g.fill();
      const ly = ROWS * TS - (y + EH / 2), fl = Math.sin(now / 120) * .03;
      for (const [r, a] of [[LANTERN_R + 2, .12 + fl], [LANTERN_R * .6, .18]]) { g.fillStyle = `rgba(255,205,110,${a})`; g.beginPath(); g.arc(x + 4, ly, r, 0, 6.29); g.fill(); }
      g.fillStyle = '#ffd36b'; g.fillRect(x + 3, ly - 1, 2, 2);
      // hooded figure
      g.fillStyle = '#3a2f4a'; g.fillRect(x + 2, y, 4, 2); g.fillRect(x + 1, y + 2, 6, 6 - step); g.fillStyle = '#5a4a6e'; g.fillRect(x + 2, y + 2, 4, 1);
      g.fillStyle = '#efe3c8'; g.fillRect(x + 3, y + 2, 2, 1);
      g.fillStyle = '#241a2c'; g.fillRect(x + (e.dir > 0 ? 7 : 0), y + 3, 1, 3);
      g.fillStyle = '#ffd36b'; g.fillRect(x + (e.dir > 0 ? 7 : -1), y + 1 + step, 2, 2); g.fillStyle = '#fff4c2'; g.fillRect(x + (e.dir > 0 ? 7 : -1), y + 1 + step, 1, 1);
    } else {
      // shade hound: low, long, two violet eyes
      g.fillStyle = 'rgba(122,92,255,.2)'; g.fillRect(x - 2, y, 12, 3);
      g.fillStyle = '#1a1230'; g.fillRect(x, y + 1, 8, 6); g.fillRect(x + (e.dir > 0 ? 6 : -1), y, 3, 3);
      g.fillStyle = '#2a1c4a'; g.fillRect(x + 1 + step, y + 6, 2, 2); g.fillRect(x + 5 - step, y + 6, 2, 2);
      g.fillStyle = '#c7b4ff'; g.fillRect(x + (e.dir > 0 ? 7 : 0), y + 1, 1, 1); g.fillRect(x + (e.dir > 0 ? 8 : -1), y + 1, 1, 1);
    }
  }
}
// ---------- parallax backdrop: far ridges, near ridges, clouds; mirrored haze below ----------
function ridge(seed, baseY, amp, step, col, par) {
  const off = camX * par;
  g.fillStyle = col; g.beginPath(); g.moveTo(camX - 4, HZ);
  for (let x = camX - 8; x <= camX + W + 8; x += step) {
    const wx = x + off; const h = baseY - amp * (0.55 + 0.45 * Math.sin(wx / 37 + seed) * Math.cos(wx / 61 - seed));
    g.lineTo(x, Math.round(h));
  }
  g.lineTo(camX + W + 8, HZ); g.closePath(); g.fill();
}
function drawBackdrop(now, t, night, top, low) {
  const far = night ? 'rgba(80,70,120,.5)' : 'rgba(120,120,160,.28)', near = night ? 'rgba(60,50,95,.7)' : 'rgba(95,105,130,.35)';
  // clouds drift with the hours, not the clock on the wall
  const drift = (t * 14) % (W + 60);
  for (let i = 0; i < 5; i++) {
    const cx = camX + ((i * 73 + drift * (0.6 + i * 0.1)) % (W + 60)) - 30, cy = 12 + (i * 11) % 30, cw = 18 + (i % 3) * 8;
    g.fillStyle = night ? 'rgba(200,190,240,.10)' : 'rgba(255,255,255,.45)';
    g.fillRect(cx, cy, cw, 3); g.fillRect(cx + 3, cy - 2, cw - 8, 2); g.fillRect(cx + 5, cy + 3, cw - 12, 1);
  }
  ridge(1.3, HZ - 26, 18, 4, far, 0.25);
  ridge(4.1, HZ - 14, 12, 3, near, 0.5);
  // mirrored haze in the shadow world
  g.fillStyle = night ? 'rgba(120,100,200,.08)' : 'rgba(120,100,200,.06)';
  for (let i = 0; i < 4; i++) g.fillRect(camX - 4, HZ + 10 + i * 14, W + 8, 6);
}
function drawDial() {
  const w = dial.width, h = dial.height, t = st.t;
  dg.clearRect(0, 0, w, h);
  const dayW = Math.round(w * 0.7);
  dg.fillStyle = '#3a3046'; dg.fillRect(0, 0, dayW - 1, h);
  dg.fillStyle = '#26214a'; dg.fillRect(dayW, 0, w - dayW, h);
  const nx0 = dayW * (NOON - .25) / DUSK, nx1 = dayW * (NOON + .25) / DUSK;
  dg.fillStyle = '#5a4b3a'; dg.fillRect(nx0, 0, nx1 - nx0, h);
  // chime bands each hour
  for (let hr = 0; hr < DUSK; hr++) { const a = dayW * (hr + .6) / DUSK, b = dayW * (hr + .75) / DUSK, c = dayW * (hr + 1) / DUSK; dg.fillStyle = 'rgba(240,184,78,.35)'; dg.fillRect(a, h - 3, b - a, 3); dg.fillStyle = 'rgba(255,107,90,.6)'; dg.fillRect(b, h - 3, c - b, 3); }
  // the shadow's sideways offset through the day: a line that crosses the centre at noon
  for (let x = 0; x < dayW; x += 1) { const tt = x / dayW * DUSK; if (isGone(tt)) continue; const off = (NOON - tt) / NOON; const yy = Math.round(h / 2 - off * (h / 2 - 2)); dg.fillStyle = '#9d86ff'; dg.fillRect(x, yy, 1, 1); }
  dg.fillStyle = 'rgba(199,180,255,.35)'; dg.fillRect(0, Math.round(h / 2), dayW, 1);
  dg.fillStyle = '#c7b4ff'; dg.fillRect(dayW + 6, 3, 3, 3); dg.fillRect(w - 12, 7, 2, 2);
  const mx = t < DUSK ? t / DUSK * dayW : dayW + (t - DUSK) / (DAY_TOTAL - DUSK) * (w - dayW);
  dg.fillStyle = '#f0b84e'; dg.fillRect(Math.min(w - 2, Math.round(mx)) - 1, 0, 3, h);
  dg.fillStyle = '#fff4c2'; dg.fillRect(Math.min(w - 2, Math.round(mx)), 0, 1, h);
  // sun arc across the day band, moon across the night band
  if (t < DUSK) { const k = t / DUSK, sx = Math.round(4 + k * (dayW - 8)), sy = Math.round(h - 4 - Math.sin(k * Math.PI) * (h - 7)); dg.fillStyle = '#fff2b0'; dg.fillRect(sx - 1, sy - 1, 3, 3); dg.fillStyle = '#ffd25e'; dg.fillRect(sx, sy, 1, 1); }
  else { const k = (t - DUSK) / (DAY_TOTAL - DUSK), sx = Math.round(dayW + 4 + k * (w - dayW - 8)), sy = Math.round(h - 4 - Math.sin(k * Math.PI) * (h - 7)); dg.fillStyle = '#efe7ff'; dg.fillRect(sx - 1, sy - 1, 3, 3); dg.fillStyle = '#26214a'; dg.fillRect(sx, sy - 1, 2, 2); }
  $('phase').textContent = (st.grav < 0 && !st.sleeping ? '◀ ' : '') + PHASE(t);
  $('day').textContent = st.day;
}

function loop(now) {
  if (!last) last = now;
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  render(now);
  requestAnimationFrame(loop);
}
function resize() {
  const stg = $('stage'), aw = stg.clientWidth, ah = stg.clientHeight;
  // landscape screens get a wider window onto wide stages
  const landscape = window.innerWidth > window.innerHeight;
  const want = landscape && L ? Math.min(336, Math.max(240, L.PX)) : 240;
  if (want !== W) { W = want; cv.width = W; }
  let sc = Math.min(aw / W, ah / H);
  const isc = Math.floor(sc);
  sc = isc >= 1 && sc - isc < 0.35 ? isc : sc >= 2 ? Math.floor(sc * 2) / 2 : sc; // snap to whole pixels when it costs little space
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
}
window.addEventListener('resize', resize);
document.fonts && document.fonts.ready.then(resize);

// ---------- input ----------
const KMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'j', w: 'j', W: 'j', ' ': 'j', ArrowDown: 'w', s: 'w', S: 'w', e: 'p', E: 'p', x: 'p', X: 'p', Shift: 'p', f: 'f', F: 'f', c: 'f', C: 'f' };
window.addEventListener('keydown', e => {
  if (!$('overlay').hidden) { if (e.key === 'Escape') hideCard(); return; }
  const k = KMAP[e.key];
  if (e.key === 'v' || e.key === 'V') { if (!e.repeat) toggleView(); e.preventDefault(); return; }
  if (k) { e.preventDefault(); if (k === 'j' && !keys.j) jumpEdge = true; if (k === 'f' && !keys.f) flipEdge = true; keys[k] = 1; }
  else if (e.key === 'r' || e.key === 'R') load(li);
});
window.addEventListener('keyup', e => { const k = KMAP[e.key]; if (k) keys[k] = 0; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
document.querySelectorAll('.ctl').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} if (k === 'j') jumpEdge = true; if (k === 'f') flipEdge = true; keys[k] = 1; b.classList.add('on'); });
  const up = () => { keys[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('menuBtn').onclick = menu;
$('resetBtn').onclick = () => { load(li); beep(240, .06, 'triangle', .04); };
$('hint').onclick = () => $('hint').classList.remove('open');
$('helpBtn').onclick = () => { $('hint').classList.toggle('open'); };
$('viewBtn').onclick = toggleView;
$('rotBtn').onclick = async () => {
  // Fullscreen + landscape lock works in Android Chrome; iPhones can only rotate by hand.
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); toast('LANDSCAPE LOCKED'); }
  catch (e) { toast(window.innerWidth > window.innerHeight ? 'ALREADY LANDSCAPE' : 'TURN YOUR PHONE SIDEWAYS (unlock rotation)'); }
  setTimeout(resize, 300);
};
window.addEventListener('orientationchange', () => setTimeout(resize, 200)); $('viewBtn').classList.toggle('on', save.view25);

function start(data) {
  const i = data && Number.isInteger(data.li) ? data.li : (save.at || 0);
  load(Math.min(i, LEVELS.length - 1));
  if (/[?&#]daily/.test(location.href)) { save.seen = true; requestAnimationFrame(loop); startDaily(); return; }
  if (data && data.st && data.st.p && data.st.crumble) st = data.st;
  requestAnimationFrame(loop);
  if (!save.seen && !(data && data.st)) intro();
}
function intro() {
  showCard(`<div class="logo"><span>GNOMON</span><i></i></div>
    <p>A platformer in two worlds. Your shadow lives upside-down below you and copies every move, and the sun only moves when you do.</p>
    <p class="sub">Pick where to start. You can switch any time from LEVELS.</p>
    <div class="row"><button class="btn" id="campBtn">Start at stage 1</button><button class="btn primary" id="demoBtn">Play the hard demo</button></div>
    <div class="row"><button class="btn daily" id="dailyIntro">☀ Today's Daily Sundial</button><button class="btn" id="howBtn2">How to play first</button></div>`);
  const go = demoFirst => { save.demoFirst = demoFirst; save.seen = true; persist(); hideCard(); load(order()[0]); };
  $('campBtn').onclick = () => go(false); $('demoBtn').onclick = () => go(true);
  $('howBtn2').onclick = () => { save.seen = true; persist(); how(); };
  $('dailyIntro').onclick = () => { save.seen = true; persist(); startDaily(); };
}
if (/[?&]test/.test(location.search)) window.__gnomon = { get st() { return st; }, win, startDaily };
window.claude?.hot?.snapshot?.(() => ({ li, st }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
